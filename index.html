<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#120403" />
  <title>Cooking Process — Rich Alucard</title>
  <meta name="description" content="A private visual soundboard for Rich Alucard." />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@500;600&display=swap');
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit}
    body{background:#ebe8e3;color:#f3dec0;font-family:Inter,system-ui,sans-serif}
    #world{position:relative;width:100vw;height:100vh;overflow:hidden;background-image:linear-gradient(rgba(18,4,3,.05),rgba(18,4,3,.05)),url('reference.png');background-size:cover;background-position:center;background-repeat:no-repeat}
    #world.dragover:after{content:'RELEASE THE SOUND';position:absolute;inset:18px;border:2px dashed rgba(174,19,20,.9);display:grid;place-items:center;color:#fff;background:rgba(72,4,3,.28);font:700 clamp(28px,5vw,70px) 'Cormorant Garamond';letter-spacing:.12em;text-shadow:0 3px 18px #000;z-index:40;pointer-events:none}
    .top{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;background:rgba(17,4,3,.88);border:1px solid rgba(167,36,27,.72);box-shadow:0 10px 35px rgba(0,0,0,.32);backdrop-filter:blur(9px)}
    .top h1{margin:0;font:700 20px 'Cormorant Garamond';letter-spacing:.1em;white-space:nowrap}.top span{font-size:10px;color:#b98e70;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}.add{border:1px solid #9b3529;background:#771711;color:#f8dfbd;padding:8px 11px;cursor:pointer}.add:hover{background:#a32118}.add input{display:none}
    .hint{position:absolute;left:24px;bottom:20px;z-index:20;background:rgba(15,4,3,.8);border-left:3px solid #a5261e;padding:10px 13px;font-size:11px;line-height:1.5;letter-spacing:.04em;color:#d8b998;backdrop-filter:blur(8px);transition:.3s}.hint strong{display:block;color:#f4dec1;font:700 17px 'Cormorant Garamond'}.hint.hidden{opacity:.15}
    .sound{position:absolute;width:150px;min-height:138px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;user-select:none;z-index:10;filter:drop-shadow(0 8px 8px rgba(0,0,0,.38))}.sound:active{cursor:grabbing}.sound.playing{z-index:15}.sound.playing .bat{animation:pulse .8s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px #e32c20)}
    .bat{position:relative;width:108px;height:76px;display:grid;place-items:center;transition:.2s}.bat .wings{font-size:72px;line-height:1;filter:grayscale(1) contrast(1.5);text-shadow:0 2px 1px #65120e;color:#0e0807}.bat .mic{position:absolute;font-size:30px;left:41px;top:35px;filter:grayscale(1) contrast(1.5);transform:rotate(-8deg);text-shadow:1px 1px 0 #c22c20}
    .label{max-width:150px;background:#1a0907;color:#f0d8b8;border:1px solid #a52a20;padding:7px 9px;text-align:center;font:700 14px 'Cormorant Garamond';letter-spacing:.02em;line-height:1.05;overflow-wrap:anywhere;box-shadow:inset 0 0 0 2px #3d1610}.state{font:600 9px Inter;text-transform:uppercase;letter-spacing:.14em;color:#cf6b59;margin-top:4px}.remove{position:absolute;right:7px;top:5px;width:22px;height:22px;border:1px solid #8d3028;border-radius:50%;background:#190806;color:#dcb799;cursor:pointer;opacity:0;transition:.2s}.sound:hover .remove{opacity:1}
    .playbar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:25;min-width:250px;max-width:calc(100vw - 48px);padding:10px 14px;background:rgba(16,4,3,.9);border:1px solid #8f2c24;display:none;align-items:center;gap:10px;box-shadow:0 10px 28px #0007;backdrop-filter:blur(8px)}.playbar.show{display:flex}.playbar button{width:34px;height:34px;border-radius:50%;border:1px solid #ac3d2f;background:#6e1611;color:#f6dec0;cursor:pointer}.now{font:700 15px 'Cormorant Garamond';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}.time{font-size:10px;color:#ba9275;font-variant-numeric:tabular-nums;margin-left:auto}
    @keyframes pulse{to{transform:translateY(-5px) scale(1.08)}}
    @media(max-width:700px){#world{background-size:contain;background-color:#eee}.top{top:10px}.top span{display:none}.hint{left:10px;bottom:10px}.sound{width:120px}.label{max-width:120px}.bat{transform:scale(.86)}}
  </style>
</head>
<body>
  <main id="world" aria-label="Rich Alucard sound canvas">
    <div class="top"><div><span>Rich Alucard's kitchen</span><h1>COOKING PROCESS</h1></div><label class="add">ADD SOUNDS<input id="picker" type="file" accept="audio/*,.mp3,.wav,.m4a,.aiff,.flac" multiple></label></div>
    <div class="hint" id="hint"><strong>Drop sounds anywhere.</strong>Each file becomes a playable creature.<br>Click to play · drag to rearrange.</div>
    <div class="playbar" id="playbar"><button id="barplay">Ⅱ</button><div class="now" id="now">—</div><div class="time" id="time">0:00 / 0:00</div></div>
  </main>
  <script>
  (()=>{
    const world=document.querySelector('#world'),picker=document.querySelector('#picker'),hint=document.querySelector('#hint'),bar=document.querySelector('#playbar'),barPlay=document.querySelector('#barplay'),now=document.querySelector('#now'),time=document.querySelector('#time');
    let sounds=[],active=null,drag=null,offset={x:0,y:0};
    const fmt=s=>!isFinite(s)?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
    const clean=n=>n.replace(/\.[^.]+$/,'');
    function stopAll(except){sounds.forEach(s=>{if(s!==except){s.audio.pause();s.playing=false;paint(s)}})}
    function toggle(s){if(s.audio.paused){stopAll(s);s.audio.play();s.playing=true;active=s;bar.classList.add('show')}else{s.audio.pause();s.playing=false}paint(s);syncBar()}
    function syncBar(){if(!active)return;now.textContent=clean(active.file.name);barPlay.textContent=active.audio.paused?'▶':'Ⅱ';time.textContent=fmt(active.audio.currentTime)+' / '+fmt(active.audio.duration)}
    function paint(s){s.el.classList.toggle('playing',s.playing);s.el.querySelector('.state').textContent=s.playing?'playing':'click to play'}
    function make(file,x,y,i){if(!(file.type.startsWith('audio/')||/\.(mp3|wav|m4a|aiff|flac)$/i.test(file.name)))return;const audio=new Audio(URL.createObjectURL(file));audio.preload='metadata';const el=document.createElement('div');el.className='sound';el.style.left=Math.max(75,Math.min(innerWidth-75,x+i*24))+'px';el.style.top=Math.max(100,Math.min(innerHeight-80,y+i*20))+'px';el.innerHTML=`<button class="remove" aria-label="Remove sound">×</button><div class="bat"><span class="wings">🦇</span><span class="mic">🎙️</span></div><div class="label">${escapeHtml(clean(file.name))}<div class="state">click to play</div></div>`;const s={file,audio,el,playing:false};sounds.push(s);world.appendChild(el);hint.classList.add('hidden');audio.ontimeupdate=syncBar;audio.onended=()=>{s.playing=false;paint(s);syncBar()};el.addEventListener('click',e=>{if(e.target.closest('.remove')){audio.pause();URL.revokeObjectURL(audio.src);el.remove();sounds=sounds.filter(q=>q!==s);if(active===s){active=null;bar.classList.remove('show')}return}if(!drag)toggle(s)});el.addEventListener('pointerdown',e=>{if(e.target.closest('.remove'))return;const r=el.getBoundingClientRect();drag=s;offset={x:e.clientX-r.left-r.width/2,y:e.clientY-r.top-r.height/2};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(drag!==s)return;el.style.left=Math.max(60,Math.min(innerWidth-60,e.clientX-offset.x))+'px';el.style.top=Math.max(70,Math.min(innerHeight-55,e.clientY-offset.y))+'px'});el.addEventListener('pointerup',e=>{if(drag===s){setTimeout(()=>drag=null,0);el.releasePointerCapture(e.pointerId)}})}
    function add(files,x=innerWidth/2,y=innerHeight/2){[...files].forEach((f,i)=>make(f,x,y,i))}
    function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    world.addEventListener('dragover',e=>{e.preventDefault();world.classList.add('dragover')});world.addEventListener('dragleave',e=>{if(!world.contains(e.relatedTarget))world.classList.remove('dragover')});world.addEventListener('drop',e=>{e.preventDefault();world.classList.remove('dragover');add(e.dataTransfer.files,e.clientX,e.clientY)});picker.onchange=e=>{add(e.target.files);picker.value=''};barPlay.onclick=()=>active&&toggle(active);
  })();
  </script>
</body>
</html>
